<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>情绪小怪 · 产品演示</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f4eb;color:#282726;font-family:'Microsoft YaHei',sans-serif;overflow:hidden}#stage{width:720px;height:960px;position:relative;background:radial-gradient(circle at 65% 40%,#fffef9,#f0e8db);overflow:hidden}.kicker{position:absolute;left:48px;top:45px;font-size:14px;letter-spacing:4px;color:#8b8275}h1{position:absolute;left:48px;top:76px;font-size:48px;letter-spacing:-2px;margin:0}.sub{position:absolute;left:50px;top:146px;font-size:19px;color:#877b6c}.intro{position:absolute;inset:196px 30px 110px;display:grid;grid-template-columns:repeat(5,1fr);align-content:center;gap:13px}.card{background:#fffcf7;border-radius:16px;overflow:hidden;box-shadow:0 9px 25px #4936200c;animation:rise .7s both}.card img{width:100%;display:block}.card b{display:block;text-align:center;font-size:17px;padding:8px}.demo{display:none;position:absolute;inset:0}.charm{position:absolute;left:22px;top:246px;width:300px;height:400px;border-radius:28px;box-shadow:0 15px 50px #59361b0b;object-fit:cover;transition:transform .6s}.charm.touch{transform:translate(60px,25px) rotate(-8deg)}.phone{position:absolute;right:35px;top:245px;width:330px;height:620px;background:#202226;border-radius:46px;box-shadow:0 28px 65px #34281833;padding:9px;transform:rotate(3deg)}iframe{width:100%;height:100%;border:0;border-radius:38px;background:#f8f4eb}.speaker{position:absolute;top:14px;left:120px;width:88px;height:19px;border-radius:20px;background:#202226}.ring{position:absolute;left:338px;top:489px;width:72px;height:72px;border:2px solid #247ff1;border-radius:50%;opacity:0}.ring.on{animation:scan 1s ease-out}.finger{position:absolute;right:136px;top:580px;width:42px;height:42px;background:#fff8;border:2px solid #fff;border-radius:50%;opacity:0;box-shadow:0 0 0 12px #fff3}.finger.on{animation:scan .7s ease-out}.footer{position:absolute;left:48px;bottom:44px;font-size:13px;letter-spacing:1px;color:#a29584}.counter{position:absolute;right:48px;top:80px;font-size:20px;color:#b0a391}.step{position:absolute;left:50px;top:192px;font-size:17px;color:#665b50}.end{display:none;position:absolute;inset:0;place-content:center;text-align:center;background:#f8f4eb}.end h2{font-size:44px;line-height:1.4}.end p{font-size:21px;color:#756b60}@keyframes rise{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes scan{0%{opacity:1;transform:scale(.7)}100%{opacity:0;transform:scale(2)}}</style></head><body><div id="stage"><div class="kicker">NFC · 情绪小怪</div><h1>十个小怪。十种状态。</h1><div class="sub">把今天的自己，挂在身边。</div><div class="intro"></div><div class="demo"><img class="charm"><div class="phone"><iframe title="角色互动演示"></iframe><div class="speaker"></div></div><div class="ring"></div><div class="finger"></div><div class="counter"></div><div class="step">碰一下，见见它。</div></div><div class="footer">产品交互效果演示 · 非实物拍摄</div><div class="end"><h2>有点怪。<br>也有点像我。</h2><p>碰一下，给今天一个出口。</p></div></div><script type="module">import{characters}from'./characters.js';const $=s=>document.querySelector(s);$('.intro').innerHTML=characters.map((c,i)=>`<div class="card" style="animation-delay:${i*.06}s"><img src="charms/${String(i+1).padStart(2,'0')}-${c.name}-clean.png"><b>${c.name}</b></div>`).join('');window.film={async show(i){const c=characters[i];$('.intro').style.display='none';$('.demo').style.display='block';$('h1').textContent=c.name;$('.sub').textContent=['装不下，也不装乖。','慢一点，褶子才展开。','给自己留个小结界。','歪一点，也站得住。','空着，也挺宽敞。','松口气，再撑。','绕几圈，先歇会儿。','反应慢，自有节拍。','翻个面，还是自己。','靠一下，不用说话。'][i];$('.counter').textContent=String(i+1).padStart(2,'0')+' / 10';$('.charm').src=`charms/${String(i+1).padStart(2,'0')}-${c.name}-clean.png`;$('.charm').classList.remove('touch');$('.step').textContent='碰一下，见见它。';$('iframe').src='about:blank';},touch(i){$('.charm').classList.add('touch');$('.ring').classList.remove('on');void $('.ring').offsetWidth;$('.ring').classList.add('on');$('iframe').src=i?'friends.html?c='+characters[i].id:'index.html';},tap(){const d=$('iframe').contentDocument,el=d.querySelector('canvas');if(el){el.dispatchEvent(new PointerEvent('pointerdown',{clientX:170,clientY:280,pointerId:1,bubbles:true}));el.dispatchEvent(new PointerEvent('pointerup',{clientX:170,clientY:280,pointerId:1,bubbles:true}));}$('.step').textContent='再点一下，听它说。';$('.finger').classList.remove('on');void $('.finger').offsetWidth;$('.finger').classList.add('on');},end(){$('.end').style.display='grid';}};</script></body></html>
