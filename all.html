<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>十个情绪小怪</title><style>*{box-sizing:border-box}body{margin:0;background:#faf6ee;color:#292626;font-family:'Microsoft YaHei',sans-serif}main{max-width:1100px;margin:auto;padding:40px 24px}h1{font-size:30px;margin:0 0 12px}p{color:#786d62;margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}a{display:block;text-decoration:none;color:inherit;background:#fffaf4;border-radius:18px;overflow:hidden;transition:transform .2s}a:hover{transform:translateY(-5px)}img{width:100%;display:block}span{display:block;text-align:center;padding:12px;font-size:17px;font-weight:600}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:28px 16px}}</style></head><body><main><h1>今天，有点像谁？</h1><p>碰一下挂件，见见它。也可以直接点开。</p><div class="grid"></div></main><script type="module">import{characters}from'./characters.js';document.querySelector('.grid').innerHTML=characters.map((c,i)=>`<a href="${i?'friends.html?c='+c.id:'./'}"><img src="charms/${String(i+1).padStart(2,'0')}-${c.name}-clean.png" alt="${c.name}亚克力挂件"><span>${c.name}</span></a>`).join('');</script></body></html>
